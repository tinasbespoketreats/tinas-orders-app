name: Build app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          JAR="$ANDROID_HOME/platforms/$(ls "$ANDROID_HOME/platforms" | sort -V | tail -1)/android.jar"
          mkdir -p out/classes
          "$BT/aapt2" compile --dir res -o out/res.zip
          "$BT/aapt2" link -o out/base.apk -I "$JAR" --manifest AndroidManifest.xml \
            --min-sdk-version 26 --target-sdk-version 34 --version-code "$GITHUB_RUN_NUMBER" --version-name "1.$GITHUB_RUN_NUMBER" out/res.zip
          javac -source 8 -target 8 -bootclasspath "$JAR" -d out/classes src/com/tinasbespoketreats/orders/MainActivity.java
          "$BT/d8" --lib "$JAR" --min-api 26 --output out $(find out/classes -name '*.class')
          (cd out && zip -q base.apk classes.dex)
          "$BT/zipalign" -f 4 out/base.apk out/aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass pass:tinasorders --key-pass pass:tinasorders --out TinasOrders.apk out/aligned.apk
          "$BT/apksigner" verify TinasOrders.apk
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.$GITHUB_RUN_NUMBER" TinasOrders.apk --title "Tina's Orders 1.$GITHUB_RUN_NUMBER" --notes "Open this on your phone and download TinasOrders.apk." --latest
